[build-system]
requires = ["setuptools>=70.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crispr-tool-integration"
version = "0.15.0"
description = "CRISPRloci v2 scientific tool orchestration"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
crispr-tools = "crispr_integration.cli:main"

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["crispr_integration*"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "S", "PERF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.setuptools.package-data]
crispr_integration = ["licenses/*.txt"]
