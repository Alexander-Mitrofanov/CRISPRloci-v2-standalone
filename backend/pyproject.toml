[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "crispr-web-backend"
version = "2.13.0"
description = "CRISPRloci v2 durable API and isolated scientific worker"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.139,<0.140",
  "starlette>=1.3,<1.4",
  "uvicorn>=0.51,<0.52",
  "httptools>=0.8,<0.9",
  "uvloop>=0.22,<0.23",
]

[project.optional-dependencies]
test = [
  "httpx2>=2.0,<3",
  "pytest>=9.1,<9.2",
  "ruff>=0.15,<0.16",
]

[project.scripts]
crispr-web-worker = "crispr_web.worker:main"
crispr-web-cleanup = "crispr_web.cleanup:main"

[tool.hatch.build.targets.wheel]
packages = ["src/crispr_web"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
