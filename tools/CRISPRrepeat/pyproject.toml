[build-system]
requires = ["setuptools>=70.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crisprrepeat"
version = "1.0.1"
description = "Source-bound CRISPR repeat folding and array-context evidence"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Alexander Mitrofanov"}]
dependencies = ["ViennaRNA==2.7.0"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "ruff>=0.9"]

[project.scripts]
crisprrepeat = "crisprrepeat.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
