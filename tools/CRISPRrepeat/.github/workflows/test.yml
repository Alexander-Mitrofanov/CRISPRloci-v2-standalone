name: Tests
on: [push, pull_request]
jobs:
  scientific-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[test]'
      - run: python -m pytest
      - run: python -m ruff check src tests
