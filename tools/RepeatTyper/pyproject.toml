[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "repeattyper"
version = "2.0.1"
description = "Offline repeat subtype inference preserving the CRISPRCasTyper 1.9.0 classifier"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "RepeatTyper contributors"}]
dependencies = ["numpy>=2.0,<3", "xgboost-cpu>=3.1,<4"]

[project.optional-dependencies]
test = ["pytest>=8,<9", "pandas>=2.2,<3", "ruff>=0.12", "mypy>=1.16", "build>=1,<2"]

[project.scripts]
repeattyper = "repeattyper.cli:main"

[tool.setuptools.package-data]
repeattyper = ["py.typed", "data/*.json", "data/*.tab"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
exclude = ["tests/upstream"]

[tool.mypy]
files = ["src/repeattyper"]
check_untyped_defs = true
ignore_missing_imports = true
