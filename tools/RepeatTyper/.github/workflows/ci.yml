name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements.lock -e '.[test]'
      - run: python scripts/check_private_data.py workspace
      - run: pytest -q
      - run: ruff check src tests --exclude tests/upstream
      - run: mypy
      - run: python -m build
