[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cctk"
version = "2.0.2"
description = "CRISPR comparison toolkit with bounded offline interfaces"
requires-python = ">=3.11"
authors = [{name = "Alan Collins"}, {name = "Alexander Mitrofanov"}]
license = "GPL-3.0-only"
readme = "README.md"
dependencies = ["numpy==2.2.6", "matplotlib==3.10.8", "DendroPy==5.0.8"]

[project.scripts]
cctk = "cctk.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
