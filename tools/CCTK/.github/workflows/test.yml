name: Standalone verification
on: [push, pull_request]
jobs:
  installed-wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-test.lock
      - run: python scripts/check_private_data.py workspace
      - run: ruff check src tests scripts/regenerate_oracle.py
      - run: mypy --follow-imports=skip --ignore-missing-imports src/cctk/comparison.py src/cctk/io.py src/cctk/process.py src/cctk/policy.py src/cctk/cli.py
      - name: Build and exercise the installed wheel from the Git archive
        run: |
          archive_dir="$(mktemp -d)"
          git archive HEAD | tar -x -C "$archive_dir"
          cd "$archive_dir"
          python -m build --no-isolation
          python -m pip install --no-deps dist/*.whl
          python -m pytest
        env:
          MPLBACKEND: Agg
          MPLCONFIGDIR: /tmp/cctk-ci-matplotlib
