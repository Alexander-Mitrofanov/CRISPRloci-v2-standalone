[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spacerplacer"
version = "1.0.1.post3"
description = "Ancestral reconstruction and orientation analysis for CRISPR spacer arrays"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { file = "LICENSE" }
authors = [
  { name = "SpacerPlacer authors" },
]
dependencies = [
  "biopython>=1.79",
  "dill>=0.3.5.1",
  "graphviz>=0.20.1",
  "matplotlib>=3.4.3",
  "numpy>=1.21.4",
  "palettable>=3.3.0",
  "pandas>=1.3.4",
  "PyQt5>=5.15.6",
  "scipy>=1.7.1",
  "seaborn>=0.11.2",
  "sympy>=1.11.1",
  "ete3>=3.1.2",
]

[project.scripts]
spacerplacer = "spacerplacer:main"

[project.optional-dependencies]
test = [
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
]

[tool.setuptools]
include-package-data = true
py-modules = ["spacerplacer"]

[tool.setuptools.packages.find]
include = ["sp_model*"]

[tool.setuptools.package-data]
sp_model = [
  "mafft_scripts/mafft-linux64/*",
  "mafft_scripts/mafft-mac/*",
  "mafft_scripts/mafft-win/*",
  "bdm_likelihood_computation/sympy_bdm_lh_fct/*",
]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "S", "PERF"]
ignore = [
  "B007",
  "B905",
  "S301",
  "S311",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
