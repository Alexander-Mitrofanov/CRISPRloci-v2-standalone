[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crisprleader"
version = "2.0.0a1"
description = "Reproducible reference-supported CRISPR leader core and motif evidence"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Alexander Mitrofanov"}]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8", "ruff>=0.9", "mypy>=1.14", "jsonschema>=4.23", "build>=1.2", "setuptools>=77", "wheel"]

[project.scripts]
crisprleader = "crisprleader.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
crisprleader = ["data/**/*", "schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"
files = ["src/crisprleader"]
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
