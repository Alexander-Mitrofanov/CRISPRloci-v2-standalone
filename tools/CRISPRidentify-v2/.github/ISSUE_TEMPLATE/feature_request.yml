name: Feature request
description: Propose a scoped user, workflow, or scientific capability.
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or scientific problem cannot be solved reliably today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Include the CLI, report, schema, or decision contract you expect.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation plan
      description: How would correctness, compatibility, and performance be evaluated?
    validations:
      required: true
  - type: textarea
    id: data
    attributes:
      label: Data, model, and license implications
      description: Identify any new datasets, trained artifacts, external tools, or licenses.
