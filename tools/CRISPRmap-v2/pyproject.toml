[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crisprmap-v2"
version = "2.1.0a2"
description = "Offline prokaryotic CRISPR repeat mapping with versioned historical annotation evidence"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Alexander Mitrofanov"}]
dependencies = []

[project.optional-dependencies]
scale = ["rapidfuzz==3.14.1"]
structure = ["ViennaRNA==2.7.0"]
test = ["pytest>=8,<10", "ruff>=0.9"]

[project.scripts]
crisprmap = "crisprmap.cli:main"

[project.urls]
Repository = "https://github.com/Alexander-Mitrofanov/CRISPRmap-v2"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
