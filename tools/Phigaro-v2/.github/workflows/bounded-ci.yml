name: bounded-worker
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.lock pytest==8.4.2 .
      - run: python -m pip check
      - run: python -m pytest -q tests/test_bounded.py
      - run: python scripts/check_private_data.py workspace
